# PyPI package: wheels that carry the compiled `stockwise` binary, so
# `pipx install stockwise` and `uvx stockwise` work without Rust. There is no
# Python code; maturin builds the crate from Cargo.toml (version included) and
# puts the binary on PATH. Cargo never reads this file.
#
#   uvx maturin build --release      # wheel for this machine, in target/wheels/
#   uvx maturin sdist                # source distribution (needs Rust 1.97+ to install)
#
# Release wheels are built by the `pypi` jobs in .github/workflows/release.yml.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "stockwise"
dynamic = ["version"]
description = "Stock market toolkit for your terminal — NSE/BSE and US stocks, mutual funds, F&O, crypto and FX: quotes, charts, screeners, backtests, SIP/XIRR, paper trading, portfolio and tax."
readme = "packaging/pypi/README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "iamsaquib8", email = "saquibulhassan6@gmail.com" }]
keywords = ["stocks", "trading", "finance", "nse", "bse", "cli", "stock-market", "backtesting", "portfolio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/iamsaquib8/stockwise"
Documentation = "https://iamsaquib8.github.io/stockwise/"
Changelog = "https://github.com/iamsaquib8/stockwise/blob/master/CHANGELOG.md"
Issues = "https://github.com/iamsaquib8/stockwise/issues"

[tool.maturin]
bindings = "bin"
strip = true
