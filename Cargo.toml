[package]
name = "stockwise"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["iamsaquib8 <saquibulhassan6@gmail.com>"]
description = "Autonomous stock market CLI — quotes, analysis, backtesting, SIP, intraday signals, tax, and wealth tracking across US and Indian markets."
documentation = "https://github.com/iamsaquib8/stockwise/tree/master/docs"
homepage = "https://github.com/iamsaquib8/stockwise"
repository = "https://github.com/iamsaquib8/stockwise"
readme = "README.md"
license = "MIT"
keywords = ["stocks", "trading", "finance", "cli", "stock-market"]
categories = ["command-line-utilities", "finance"]
exclude = ["assets/", "docs/", ".github/", "*.tape"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
tabled = "0.18"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
redis = { version = "0.27", features = ["tokio-comp"] }

[profile.release]
opt-level = 3
lto = true
