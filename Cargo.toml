[package]
name = "stockwise"
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
authors = ["iamsaquib8 <saquibulhassan6@gmail.com>"]
description = "Stock market toolkit for your terminal — NSE/BSE and US stocks, mutual funds, F&O, crypto and FX: quotes, charts, screeners, backtests, SIP/XIRR, paper trading, portfolio and tax."
documentation = "https://iamsaquib8.github.io/stockwise/"
homepage = "https://github.com/iamsaquib8/stockwise"
repository = "https://github.com/iamsaquib8/stockwise"
readme = "README.md"
license = "MIT"
keywords = ["stocks", "trading", "finance", "cli", "stock-market"]
categories = ["command-line-utilities", "finance"]
exclude = ["assets/", "docs/", "site/", ".github/", "*.tape", "install.sh", "packaging/", "Dockerfile", ".dockerignore", "flake.nix", "flake.lock", "pyproject.toml", "scripts/"]

# `cargo binstall stockwise` downloads the prebuilt release binary instead of
# compiling. Asset names must match .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# `.deb` and `.rpm` release assets, built by packaging/linux/build-packages.sh
# (cargo-deb, cargo-generate-rpm). It writes the man pages and shell
# completions into target/pkg/ from the binary first.
[package.metadata.deb]
maintainer = "iamsaquib8 <saquibulhassan6@gmail.com>"
copyright = "2026, iamsaquib8"
license-file = ["LICENSE", "0"]
extended-description = """\
One binary, no API keys or account needed; your portfolio stays in local \
files. For education and information, not financial advice."""
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/stockwise", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/stockwise/", "644"],
    ["CHANGELOG.md", "usr/share/doc/stockwise/", "644"],
    ["DISCLAIMER.md", "usr/share/doc/stockwise/", "644"],
    ["target/pkg/man/*.1.gz", "usr/share/man/man1/", "644"],
    ["target/pkg/completions/stockwise.bash", "usr/share/bash-completion/completions/stockwise", "644"],
    ["target/pkg/completions/_stockwise", "usr/share/zsh/vendor-completions/", "644"],
    ["target/pkg/completions/stockwise.fish", "usr/share/fish/vendor_completions.d/", "644"],
]

[package.metadata.generate-rpm]
summary = "Stock market toolkit for your terminal: NSE/BSE and US stocks"
assets = [
    { source = "target/release/stockwise", dest = "/usr/bin/stockwise", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/stockwise/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/stockwise/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/stockwise/CHANGELOG.md", mode = "644", doc = true },
    { source = "DISCLAIMER.md", dest = "/usr/share/doc/stockwise/DISCLAIMER.md", mode = "644", doc = true },
    { source = "target/pkg/man/*.1.gz", dest = "/usr/share/man/man1/", mode = "644", doc = true },
    { source = "target/pkg/completions/stockwise.bash", dest = "/usr/share/bash-completion/completions/stockwise", mode = "644" },
    { source = "target/pkg/completions/_stockwise", dest = "/usr/share/zsh/site-functions/_stockwise", mode = "644" },
    { source = "target/pkg/completions/stockwise.fish", dest = "/usr/share/fish/vendor_completions.d/stockwise.fish", mode = "644" },
]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
colored = "3"
dirs = "7"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
redis = { version = "1.7", features = ["tokio-comp"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
clap_mangen = { version = "0.3", features = ["env"] }
# Email notifications over SMTP (rustls, no OpenSSL).
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
# Desktop notifications, behind the `desktop-notify` feature.
notify-rust = { version = "4.11", optional = true }
# `tui` feature: interactive dashboard (crossterm is re-exported by ratatui).
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"], optional = true }
# `server` feature: read-only JSON API and Prometheus metrics.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"], optional = true }
# Broker integrations: dyn-compatible async trait, OS keyring for secrets,
# SHA-256 for Kite/Fyers login checksums, gzip for Upstox instrument files,
# hidden prompt for pasted access tokens.
async-trait = "0.1"
keyring = "4"
sha2 = "0.11"
flate2 = "1"
rpassword = "7"
# `wasm-plugins` feature: sandboxed WASM strategy plugins. wasmi is a pure-Rust
# interpreter with fuel metering; `wat` lets plugins and tests be WAT text.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "stable", "auto-dispatch", "wat"], optional = true }

[features]
default = ["tui", "server"]
tui = ["dep:ratatui"]
server = ["dep:axum"]
# `cargo install stockwise --features desktop-notify` for desktop notifications.
desktop-notify = ["dep:notify-rust"]
# `cargo install stockwise --features wasm-plugins` for `backtest -s wasm:PATH`.
wasm-plugins = ["dep:wasmi"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
