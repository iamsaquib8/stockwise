# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review settings. Rules mirror CLAUDE.md (recommendations policy) and DISCLAIMER.md.
language: en-US
early_access: false
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: true
  request_changes_workflow: false
  path_filters:
    - "!Cargo.lock"
    - "!changelog.d/**"
    - "!site/**"
    - "!assets/**"
    - "!**/fixtures/**"
  path_instructions:
    - path: "src/**/*.rs"
      instructions: |
        Pure Rust, 2024 edition. CI already enforces `cargo fmt`, `cargo clippy -D warnings`
        and `cargo test`: do not comment on formatting or lints.
        - Money is integer minor units (i64) or rust_decimal::Decimal. Flag f64 used for money;
          f64 is fine for analytical ratios (XIRR, Sharpe, beta).
        - Recommendations policy: actions (BUY/WATCH/AVOID, ADD/HOLD/TRIM/EXIT) come only
          from src/action.rs. Flag any action, call or price level (entry, stop, target,
          invalidation) produced anywhere else, including AI prompts and MCP tool text.
        - Flag an action shown without its reasons or disclaimer, a BUY, ADD, HOLD or TRIM
          without its invalidation price, and any action other than NO CALL given when data
          coverage is below 60%.
        - Flag a change to a rule or threshold in src/action.rs that does not bump
          METHODOLOGY and update the "Actions" section of docs/methodology.md.
        - No telemetry; user data stays local. Portfolio math, tax and backup work offline
          from local files: flag new network calls on those paths, or secrets written to
          logs or URLs.
        - Flag committed raw market-data series (OHLCV) outside test fixtures.
        - Use anyhow::Result in the binary; do not add unwrap/expect on user input or I/O.
    - path: "tests/**"
      instructions: |
        Integration tests run the real binary against a scratch STOCKWISE_HOME. Flag tests that
        touch the network, the real data directory, or leave child processes running.
    - path: "docs/**"
      instructions: "Check that commands, flags and output shown match the code."
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
chat:
  auto_reply: true
