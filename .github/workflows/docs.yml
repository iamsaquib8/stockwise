name: Docs

# Builds the mdBook site from docs/ and publishes it to GitHub Pages on every
# push to master. Pull requests only build it, to catch broken pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "site/**"
      - "assets/**"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "DISCLAIMER.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "assets/**"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "DISCLAIMER.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Build
        run: python3 site/build.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
