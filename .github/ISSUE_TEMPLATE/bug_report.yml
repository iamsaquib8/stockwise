name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do **not** include real broker credentials,
        API keys, or account numbers anywhere in this issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: "Running `stockwise quote RELIANCE` panicked with ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran (redact anything sensitive)
      placeholder: "stockwise deep HDFCBANK -p 6mo"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StockWise version
      description: Output of `stockwise --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant output. This is automatically formatted as code.
      render: shell
